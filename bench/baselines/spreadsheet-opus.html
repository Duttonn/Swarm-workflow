<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spreadsheet</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --line:#d5d9e0; --ink:#1c2026; --muted:#5d6675; --accent:#1f5fbf; --sel:#dbe7fb; --hot:#ffd9d9; --note:#fff3c4; font-family: "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-size:14px; }
header { display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
header h1 { font-size:16px; margin:0; }
nav { display:flex; flex-wrap:wrap; gap:4px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
nav button { border:1px solid var(--line); background:#fff; padding:4px 9px; border-radius:4px; cursor:pointer; font-size:13px; }
nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
main { padding:14px 16px; }
.panel { display:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
.panel.active { display:block; }
.panel h2 { font-size:15px; margin:0 0 10px; }
.bar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.bar .addr { min-width:52px; font-weight:600; font-family:Consolas, monospace; }
#formula { flex:1; font-family:Consolas, monospace; padding:5px 8px; border:1px solid var(--line); border-radius:4px; }
.scroll { overflow:auto; max-height:60vh; border:1px solid var(--line); }
table.grid { border-collapse:collapse; font-family:Consolas, monospace; font-size:13px; }
table.grid th, table.grid td { border:1px solid var(--line); padding:2px 6px; min-width:64px; height:24px; white-space:nowrap; }
table.grid th { background:#eef0f4; color:var(--muted); font-weight:500; text-align:center; position:sticky; top:0; }
table.grid th.rh { position:sticky; left:0; }
table.grid td { cursor:cell; }
table.grid td.selected { outline:2px solid var(--accent); outline-offset:-2px; background:var(--sel); }
table.grid td.num { text-align:right; }
table.grid td.left { text-align:left; } table.grid td.right { text-align:right; } table.grid td.center { text-align:center; }
table.grid td.bold { font-weight:700; } table.grid td.italic { font-style:italic; }
table.grid td.err { color:#b3261e; }
table.grid td.hot { background:var(--hot); } table.grid td.note { background:var(--note); }
table.grid td.warn { background:#ffe6c7; } table.grid td.good { background:#d9f5dc; }
form.row, .row { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin-bottom:10px; }
label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
input, select, textarea, button { font:inherit; }
input, select, textarea { padding:4px 6px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink); }
input[type=checkbox] { width:auto; }
textarea { font-family:Consolas, monospace; min-width:260px; min-height:90px; }
button.act { padding:5px 10px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:4px; cursor:pointer; }
button.act:disabled { opacity:.5; cursor:default; }
button.sub { padding:3px 8px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
.msg { color:#b3261e; margin:4px 0; }
.ok { color:#1f7a3a; margin:4px 0; }
ul.list { margin:6px 0; padding-left:18px; } ul.list li { margin:2px 0; }
table.kv { border-collapse:collapse; } table.kv td, table.kv th { border:1px solid var(--line); padding:3px 8px; text-align:left; }
pre { background:#f0f2f5; padding:8px; border-radius:4px; overflow:auto; max-height:40vh; font-size:12px; }
.muted { color:var(--muted); font-size:12px; }
svg.chart { background:#fff; border:1px solid var(--line); }
</style>
</head>
<body>
<header><h1>Spreadsheet</h1><span class="muted" id="status">Click a cell, type in the formula bar, press Enter.</span></header>
<nav id="tabs">
<button data-tab="grid">Grid</button><button data-tab="parser">Parser</button><button data-tab="calc">Calc</button><button data-tab="functions">Functions</button><button data-tab="deps">Deps</button><button data-tab="errors">Errors</button><button data-tab="format">Format</button><button data-tab="history">History</button><button data-tab="rowscols">Rows &amp; columns</button><button data-tab="fill">Fill</button><button data-tab="find">Find</button><button data-tab="csv">CSV</button><button data-tab="chart">Chart</button><button data-tab="validation">Validation</button><button data-tab="names">Names</button><button data-tab="sheets">Sheets</button><button data-tab="conditional">Conditional</button><button data-tab="stats">Stats</button><button data-tab="persist">Persist</button><button data-tab="keys">Keys</button>
</nav>
<main>
<section id="panel-grid" class="panel"></section><section id="panel-parser" class="panel"></section><section id="panel-calc" class="panel"></section><section id="panel-functions" class="panel"></section><section id="panel-deps" class="panel"></section><section id="panel-errors" class="panel"></section><section id="panel-format" class="panel"></section><section id="panel-history" class="panel"></section><section id="panel-rowscols" class="panel"></section><section id="panel-fill" class="panel"></section><section id="panel-find" class="panel"></section><section id="panel-csv" class="panel"></section><section id="panel-chart" class="panel"></section><section id="panel-validation" class="panel"></section><section id="panel-names" class="panel"></section><section id="panel-sheets" class="panel"></section><section id="panel-conditional" class="panel"></section><section id="panel-stats" class="panel"></section><section id="panel-persist" class="panel"></section><section id="panel-keys" class="panel"></section>
</main>
<script id="app">
(function () {

  show(name) {

// ---------- addresses ----------

// ---------- feature: grid ----------
App.features.grid = { model: {
  toAddr, parseAddr, colName,
  get: (sheet, addr) => { const c = sheet.cells[norm(addr)]; return c && c.raw != null ? c.raw : ''; },
  set: (sheet, addr, raw) => { const cells = Object.assign({}, sheet.cells); const a = norm(addr); if (raw === '' || raw == null) delete cells[a]; else cells[a] = { raw: String(raw) }; return Object.assign({}, sheet, { cells }); },

  const snapshot = { sheets: st.sheets, names: st.names, active: st.active };
  const history = App.features.history.model.push(st.history, snapshot);
  const next = Object.assign({}, nextBookPatch, { history });
  App.store.set(next);
  try { App.features.persist.model.save(App.store.get()); } catch (e) { /* storage may be unavailable */ }
};
App.commitSheet = function (sheet) { const st = App.store.get(); App.commit({ sheets: st.sheets.map(s => s.id === sheet.id ? sheet : s) }); };
App.undo = function () { const st = App.store.get(); const r = App.features.history.model.undo(st.history, { sheets: st.sheets, names: st.names, active: st.active }); App.store.set(Object.assign({}, r.state, { history: r.stack })); try { App.features.persist.model.save(App.store.get()); } catch (e) {} };
App.redo = function () { const st = App.store.get(); const r = App.features.history.model.redo(st.history, { sheets: st.sheets, names: st.names, active: st.active }); App.store.set(Object.assign({}, r.state, { history: r.stack })); try { App.features.persist.model.save(App.store.get()); } catch (e) {} };
App.select = function (addr) { const st = App.store.get(); App.store.set({ ui: Object.assign({}, st.ui, { selected: norm(addr) }) }); };
const values = st => { try { return compute(st); } catch (e) { return {}; } };
const activeValues = st => (values(st)[activeSheet(st).id]) || {};
const setUi = patch => { const st = App.store.get(); App.store.set({ ui: Object.assign({}, st.ui, patch) }); };

// ---------- render helpers ----------
const h = (root, html) => { root.innerHTML = html; return root; };
const on = (root, selector, event, fn) => root.querySelectorAll(selector).forEach(el => el.addEventListener(event, fn));
const val = (root, id) => { const el = root.querySelector('#' + id); return el ? el.value : ''; };
const field = (id, label, extra) => '<label>' + esc(label) + '<input id="' + id + '" ' + (extra || '') + '></label>';
const note = (ok, text) => text ? '<p class="' + (ok ? 'ok' : 'msg') + '">' + esc(text) + '</p>' : '';

function renderGrid(root, st) {
  const sheet = activeSheet(st); if (!sheet) { h(root, '<p>No sheet.</p>'); return; }
  const vals = activeValues(st); const b = App.features.grid.model.bounds(sheet);
  const cols = Math.max(b.cols + 2, 8), rows = Math.max(b.rows + 2, 20);
  const sel = st.ui.selected || 'A1'; const classes = App.features.conditional.model.classes(sheet, vals);
  let html = '<h2>' + esc(sheet.name) + '</h2><div class="bar"><span class="addr" id="cur">' + esc(sel) + '</span><input id="formula" placeholder="=A1+A2" value="' + esc(App.features.grid.model.get(sheet, sel)) + '" autocomplete="off"> <span class="muted">Enter sets the cell, Esc cancels</span></div><div class="scroll"><table class="grid"><thead><tr><th class="rh"></th>';
  for (let c = 0; c < cols; c++) html += '<th>' + colName(c) + '</th>';
  html += '</tr></thead><tbody>';
  for (let r = 0; r < rows; r++) {
    html += '<tr><th class="rh">' + (r + 1) + '</th>';
    for (let c = 0; c < cols; c++) {
      const a = toAddr(c, r); const v = vals[a]; const style = styleOf(sheet, a);
      const cls = [a === sel ? 'selected' : '', typeof v === 'number' && style.align === 'auto' ? 'num' : '', style.align !== 'auto' ? style.align : '', style.bold ? 'bold' : '', style.italic ? 'italic' : '', isErr(v) ? 'err' : ''].concat(classes[a] || []).filter(Boolean).join(' ');
      html += '<td data-addr="' + a + '" tabindex="0" class="' + cls + '" title="' + esc(App.features.grid.model.get(sheet, a)) + '">' + esc(display(v, style.format)) + '</td>';
    }
    html += '</tr>';
  }
  h(root, html + '</tbody></table></div>');
  const bar = root.querySelector('#formula');
  const commitBar = () => { const cur = App.store.get(); const s = activeSheet(cur); const a = cur.ui.selected || 'A1'; if (App.features.grid.model.get(s, a) !== bar.value) App.commitSheet(App.features.grid.model.set(s, a, bar.value)); };
  bar.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commitBar(); } else if (e.key === 'Escape') { bar.value = App.features.grid.model.get(activeSheet(App.store.get()), App.store.get().ui.selected || 'A1'); } });
  const table = root.querySelector('table.grid');
  table.addEventListener('click', e => { const td = e.target.closest('td[data-addr]'); if (td) App.select(td.dataset.addr); });
  table.addEventListener('dblclick', e => { const td = e.target.closest('td[data-addr]'); if (td) { App.select(td.dataset.addr); const f = root.querySelector('#formula'); if (f) f.focus(); } });
  table.addEventListener('keydown', e => {
    const cur = App.store.get(); const s = activeSheet(cur); const bb = App.features.grid.model.bounds(s);
    const bounds = { cols: Math.max(bb.cols + 2, cols), rows: Math.max(bb.rows + 2, rows) };
    let key = e.key; if (key === 'Tab' && e.shiftKey) key = 'Shift+Tab'; if (key === 'Home' && e.ctrlKey) key = 'Ctrl+Home';
    const from = cur.ui.selected || 'A1'; const to = App.features.keys.model.next(from, key, bounds);
    if (to !== from) { e.preventDefault(); App.select(to); const td = root.querySelector('td[data-addr="' + to + '"]'); if (td) td.focus(); return; }
    if (key === 'Delete' || key === 'Backspace') { e.preventDefault(); if (App.features.grid.model.get(s, from) !== '') App.commitSheet(App.features.grid.model.set(s, from, '')); }
    else if (key.length === 1 && !e.ctrlKey && !e.metaKey) { const f = root.querySelector('#formula'); if (f) { f.value = key; f.focus(); e.preventDefault(); } }
  });
}

  root.querySelector('#sheets-form').addEventListener('submit', e => { e.preventDefault(); const cur = App.store.get(); const name = val(root, 'sheet-name').trim(); const errors = m.validate(name, cur); if (errors.length) { setUi({ sheetsMsg: errors.join('; ') }); return; } const next = m.add(cur, name); App.commit({ sheets: next.sheets }); setUi({ sheetsMsg: '' }); });
  on(root, 'button[data-switch]', 'click', e => { App.store.set({ active: e.target.dataset.switch, ui: Object.assign({}, App.store.get().ui, { selected: 'A1' }) }); });
  on(root, 'button[data-rename]', 'click', e => { const cur = App.store.get(); const s = cur.sheets.find(x => x.id === e.target.dataset.rename); const name = prompt('New name for ' + s.name, s.name); if (name == null) return; const errors = m.validate(name, cur); if (errors.length) { setUi({ sheetsMsg: errors.join('; ') }); return; } App.commit({ sheets: m.rename(cur, s.id, name.trim()).sheets }); });
  on(root, 'button[data-remove]', 'click', e => { const cur = App.store.get(); const next = m.remove(cur, e.target.dataset.remove); App.commit({ sheets: next.sheets, active: next.active }); });
}
function renderConditional(root, st) {
  const sheet = activeSheet(st); const m = App.features.conditional.model; const rules = sheet.conditional || [];
  h(root, '<h2>Conditional formatting</h2><form class="row" id="cond-form">' + field('cond-range', 'Range', 'value="A1:A10"') + '<label>Rule<select id="cond-kind"><option value="gt">greater than</option><option value="lt">less than</option><option value="between">between</option><option value="eq">equal to</option><option value="contains">contains text</option></select></label>' + field('cond-value', 'Value', '') + field('cond-value2', 'and (for between)', '') + '<label>Class<select id="cond-cls"><option value="hot">hot (red)</option><option value="note">note (yellow)</option><option value="warn">warn (orange)</option><option value="good">good (green)</option></select></label><button class="act" type="submit">Add rule</button></form>' + note(false, st.ui.condMsg) + (rules.length ? '<ul class="list">' + rules.map((r, i) => '<li>' + esc(r.range) + ': ' + esc(r.kind) + ' ' + esc(String(r.value == null ? '' : r.value)) + (r.kind === 'between' ? ' and ' + esc(String(r.value2)) : '') + ' -> <span class="' + esc(r.cls) + '">' + esc(r.cls) + '</span> <button class="sub" data-drop="' + i + '">remove</button></li>').join('') + '</ul>' : '<p class="muted">No rule on this sheet.</p>'));
  root.querySelector('#cond-form').addEventListener('submit', e => {
    e.preventDefault(); const range = val(root, 'cond-range'); if (!parseRange(range)) { setUi({ condMsg: 'Give a range like A1:A10.' }); return; }
    const kind = val(root, 'cond-kind'); const v = val(root, 'cond-value');
    App.commitSheet(m.addRule(activeSheet(App.store.get()), { range: range.toUpperCase(), kind, value: kind === 'contains' ? v : Number(v), value2: Number(val(root, 'cond-value2')), cls: val(root, 'cond-cls') })); setUi({ condMsg: '' });
  });
  on(root, 'button[data-drop]', 'click', e => App.commitSheet(m.removeRule(activeSheet(App.store.get()), Number(e.target.dataset.drop))));
}
function renderStats(root, st) {
  const range = st.ui.statsRange || 'A1:A5'; const s = App.features.stats.model.summary(activeValues(st), range);
  const f = v => v == null ? '-' : general(v);
  h(root, '<h2>Stats</h2><form class="row" id="stats-form">' + field('stats-range', 'Range', 'value="' + esc(range) + '"') + '<button class="act" type="submit">Compute</button></form><table class="kv"><tr><th>Cells</th><th>Numbers</th><th>Sum</th><th>Average</th><th>Min</th><th>Max</th></tr><tr><td>' + s.cells + '</td><td>' + s.count + '</td><td>' + f(s.sum) + '</td><td>' + f(s.avg) + '</td><td>' + f(s.min) + '</td><td>' + f(s.max) + '</td></tr></table>');
  root.querySelector('#stats-form').addEventListener('submit', e => { e.preventDefault(); setUi({ statsRange: val(root, 'stats-range') }); });
}
function renderPersist(root, st) {
  let size = 0; try { size = (localStorage.getItem(KEY) || '').length; } catch (e) {}
  h(root, '<h2>Persist</h2><p>The book is saved to localStorage under <code>' + esc(KEY) + '</code> after every change and restored when the page opens. Stored now: ' + size + ' characters, ' + st.sheets.length + ' sheet' + (st.sheets.length === 1 ? '' : 's') + '.</p><div class="row"><button class="act" id="persist-save">Save now</button><button class="act" id="persist-load">Reload from storage</button><button class="act" id="persist-clear">Clear storage</button></div>' + note(true, st.ui.persistMsg));
  root.querySelector('#persist-save').addEventListener('click', () => { App.features.persist.model.save(App.store.get()); setUi({ persistMsg: 'Saved.' }); });
  root.querySelector('#persist-load').addEventListener('click', () => { const doc = App.features.persist.model.load(); if (doc) App.store.set({ sheets: doc.sheets, active: doc.active, names: doc.names || {} }); setUi({ persistMsg: doc ? 'Loaded.' : 'Nothing stored.' }); });
  root.querySelector('#persist-clear').addEventListener('click', () => { App.features.persist.model.clear(); setUi({ persistMsg: 'Storage cleared; the next change saves again.' }); });
}
function renderKeys(root, st) {
  const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Tab', 'Shift+Tab', 'Home', 'Ctrl+Home'];
  const sel = st.ui.selected || 'A1'; const b = App.features.grid.model.bounds(activeSheet(st)); const bounds = { cols: Math.max(b.cols + 2, 8), rows: Math.max(b.rows + 2, 20) };
  h(root, '<h2>Keys</h2><p>Selected: <b>' + esc(sel) + '</b>. On the grid these keys move the selection; Delete clears the cell; typing starts editing in the formula bar.</p><div class="row">' + keys.map(k => '<button class="sub" data-key="' + k + '">' + k + ' &rarr; ' + App.features.keys.model.next(sel, k, bounds) + '</button>').join('') + '</div>');
  on(root, 'button[data-key]', 'click', e => App.select(App.features.keys.model.next(App.store.get().ui.selected || 'A1', e.target.dataset.key, bounds)));
}

// ---------- mount ----------
App.mount = function (doc) {
  App.doc = doc;
  const stored = App.features.persist.model.load();
  if (stored && stored.sheets && stored.sheets.length) state = Object.assign({}, state, { sheets: stored.sheets, active: stored.active, names: stored.names || {} });
  if (!state.sheets.length) state = Object.assign({}, state, { sheets: [{ id: 'sheet1', name: 'Sheet1', cells: { A1: { raw: 'Item' }, B1: { raw: 'Price' }, A2: { raw: 'Coffee' }, B2: { raw: '3.5' }, A3: { raw: 'Bread' }, B3: { raw: '2.25' }, A4: { raw: 'Total' }, B4: { raw: '=SUM(B2:B3)' } }, formats: { B4: { bold: true, format: { kind: 'currency', decimals: 2 } } }, rules: {}, conditional: [] }], active: 'sheet1' });
  const renderAll = st => {
    if (!st.sheets.some(s => s.id === st.active)) { state = Object.assign({}, st, { active: st.sheets[0] && st.sheets[0].id }); st = state; }
    for (const name of FEATURES) { const root = doc.getElementById('panel-' + name); if (root) { try { App.features[name].render(root, st); } catch (e) { root.innerHTML = '<p class="msg">' + esc(name + ' failed to render: ' + e.message) + '</p>'; } } }
    const status = doc.getElementById('status'); if (status) status.textContent = activeSheet(st).name + ' - ' + (st.ui.selected || 'A1');
  };
  App.store.subscribe(renderAll);
  doc.querySelectorAll('nav#tabs button').forEach(b => b.addEventListener('click', () => App.router.show(b.dataset.tab)));
  doc.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && e.target.id !== 'formula') { e.preventDefault(); App.undo(); } if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z')) && e.target.id !== 'formula') { e.preventDefault(); App.redo(); } });
  renderAll(state);
  App.router.show(state.ui.tab || 'grid');
};
window.App = App;
})();
</script>
<script>App.mount(document);</script>
</body>
</html>
