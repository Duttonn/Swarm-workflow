<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rain on the Window</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060b; overflow: hidden; }
  #pane { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="pane"></canvas>

<script id="storm-model" type="module">
/* The storm, as numbers. No drawing lives here: every export is pure maths and
   step(t) is deterministic, so the same second always looks the same.

   Coordinates: x runs right, y runs DOWN from the top of the pane, both in px
   of a 900 x 700 scene. PUDDLE_Y is the sill line rain dies on. */

export const W = 900;
export const H = 700;
export const PUDDLE_Y = 604;               // 0.863 H

const TAU = Math.PI * 2;

/* Deterministic hash noise in [0,1). */
function rnd(i, salt) {
  let x = Math.imul(i + 1, 0x9e3779b1) ^ Math.imul(salt + 101, 0x85ebca77);
  x = Math.imul(x ^ (x >>> 15), 0xc2b2ae3d);
  x ^= x >>> 13;
  x = Math.imul(x, 0x27d4eb2f);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}

const wrap = (v, m) => v - Math.floor(v / m) * m;
const clampX = (v) => (v < 0 ? 0 : v > W ? W : v);

/* ------------------------------------------------------------------ rain --
   Four depth layers. Layer 0 is the far wall of rain, layer 3 is the sheet
   right against the glass: vy rises with the layer index, so near falls
   faster than far. The gale only ever blows one way, so vx keeps its sign. */

const LAYERS = 4;
const PER_LAYER = 92;                      // 368 streaks
const WIND = 0.30;                         // vx / vy, always positive
const SPLASH_LIFE = 0.26;                  // seconds a splash lives
const SPLASH_RISE = 46;                    // px a splash may hop above the sill

export const layerVy = (L) => 430 + 215 * L;   // 430, 645, 860, 1075 px/s

/* One streak, resolved at time t. Each falls on its own loop from yTop to the
   puddle line, then starts again at the top: a is its age within that loop. */
function streak(L, i, t) {
  const s = L * 977 + i;
  const vy = layerVy(L) * (0.92 + 0.16 * rnd(s, 1));
  const vx = WIND * vy * (0.85 + 0.30 * rnd(s, 2));
  const yTop = -0.40 * H * (0.15 + 0.85 * rnd(s, 3));
  const fall = PUDDLE_Y - yTop;
  const T = fall / vy;
  const a = wrap(t + rnd(s, 4) * T * 13, T);
  const x0 = -0.30 * W + 1.32 * W * rnd(s, 5);
  return {
    s: s, layer: L, a: a, T: T, x0: x0,
    x: x0 + vx * a, y: yTop + vy * a,
    vx: vx, vy: vy, len: 6 + vy * 0.030,
    dim: 0.45 + 0.55 * (L / (LAYERS - 1))
  };
}

export function drops(t) {
  const out = [];
  for (let L = 0; L < LAYERS; L++) {
    for (let i = 0; i < PER_LAYER; i++) out.push(streak(L, i, t));
  }
  return out;
}

/* A streak that has just looped left a splash where it landed: the impact
   point of the loop that ended, hopping up over the sill and falling back. */
export function splashes(t) {
  const out = [];
  for (let L = 2; L < LAYERS; L++) {
    for (let i = 0; i < PER_LAYER; i++) {
      const d = streak(L, i, t);
      if (d.a >= SPLASH_LIFE) continue;
      const u = d.a / SPLASH_LIFE;
      const hop = SPLASH_RISE * Math.sin(Math.PI * u) * (0.35 + 0.65 * rnd(d.s, 6));
      out.push({
        x: d.x0 + d.vx * d.T + (rnd(d.s, 7) - 0.5) * 26 * u,
        y: PUDDLE_Y - hop,
        r: 1.2 + 1.6 * rnd(d.s, 8),
        life: 1 - u
      });
    }
  }
  return out;
}

/* ------------------------------------------------------- water on the glass --
   The pane is cut into TRACKS columns. A column holds still beads of
   condensation plus one runner released every `period` seconds. The runner
   creeps down in stick-slip bursts (dy/da = v(1 - cos) >= 0, so it can never
   travel back up) and takes the volume of every bead it passes, which is why
   its radius only ever grows. Each release gets a fresh id. */

const TRACKS = 40;
const BEADS = 3;                            // sweepable beads per column
const SLOTS = 5;                            // id stride: runner + 3 beads + 1 high bead

export function runners(t) {
  const out = [];
  for (let k = 0; k < TRACKS; k++) {
    const colX = 22 + (W - 44) * rnd(k, 30);
    const period = 7 + 9 * rnd(k, 31);
    const yStart = 26 + 130 * rnd(k, 33);
    const v = 26 + 40 * rnd(k, 34);
    const om = 1.2 + 2.4 * rnd(k, 35);
    const ph = TAU * rnd(k, 36);
    const r0 = 1.7 + 1.5 * rnd(k, 37);

    const u = t - period * rnd(k, 32);
    const c = Math.floor(u / period);
    const a = u - c * period;
    const base = ((c + 50) * TRACKS + k) * SLOTS;

    const y = yStart + v * (a - (Math.sin(om * a + ph) - Math.sin(ph)) / om);
    const rate = v * (1 - Math.cos(om * a + ph));

    let r2 = r0 * r0;
    for (let j = 0; j < BEADS; j++) {
      const bs = k * 16 + j;
      const by = yStart + 34 + (PUDDLE_Y - yStart - 70) * rnd(bs, 40);
      const br = 1.1 + 1.5 * rnd(bs, 42);
      if (y >= by) r2 += br * br;           // merged into the runner
      else out.push({ id: base + 1 + j, x: clampX(colX + (rnd(bs, 41) - 0.5) * 14),
                      y: by, r: br, rate: 0 });
    }

    const hs = k * 16 + 9;                  // a bead the runner starts below: never swept
    out.push({ id: base + 4, x: clampX(colX + (rnd(hs, 41) - 0.5) * 14),
               y: 8 + (yStart - 16) * rnd(hs, 43),
               r: 1.0 + 1.2 * rnd(hs, 42), rate: 0 });

    if (y < PUDDLE_Y - 2) {
      out.push({ id: base, x: clampX(colX + 7 * Math.sin(0.9 * a + ph)),
                 y: y, r: Math.sqrt(r2), rate: rate });
    }
  }
  return out;
}

/* -------------------------------------------------------------- lightning --
   One strike every STRIKE_PERIOD seconds on the clock, first at STRIKE_PHASE.
   A strike is a bolt, a re-strike a third of a second later, and an afterglow
   that decays with a 0.45 s time constant: under 3% of peak by +1.5 s and
   gone by +2.5 s. */

export const STRIKE_PERIOD = 8;
export const STRIKE_PHASE = 1.4;

export function flash(t) {
  const u = wrap(t - STRIKE_PHASE, STRIKE_PERIOD);
  const bolt = 0.62 * Math.exp(-Math.pow((u - 0.06) / 0.08, 2));
  const restrike = 0.50 * Math.exp(-Math.pow((u - 0.28) / 0.07, 2));
  const afterglow = 0.36 * Math.exp(-u / 0.45);
  const v = bolt + restrike + afterglow;
  return v > 1 ? 1 : v;
}

/* The bolt's own position, so the renderer knows where the sky tore open. */
export function boltX(t) {
  const n = Math.floor((t - STRIKE_PHASE) / STRIKE_PERIOD);
  return 0.15 * W + 0.70 * W * rnd(n + 7, 60);
}

/* ------------------------------------------------------------------ step -- */
export function step(t) {
  return {
    width: W, height: H, puddleY: PUDDLE_Y,
    drops: drops(t), runners: runners(t), splashes: splashes(t),
    flash: flash(t), boltX: boltX(t)
  };
}
</script>

<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2;
  var pane = document.getElementById('pane');
  var ctx = pane.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var model = null, city = null, start = null;
  var W = 900, H = 700, PUDDLE = 604;

  /* The model is a module block in this document. Evaluate it from its own
     text so the page still makes zero network requests. */
  var src = document.getElementById('storm-model').textContent;
  var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  import(url).then(function (m) {
    model = m; W = m.W; H = m.H; PUDDLE = m.PUDDLE_Y;
    city = buildCity();
    requestAnimationFrame(frame);
  });

  function resize() {
    pane.width = Math.max(1, Math.floor(pane.clientWidth * dpr));
    pane.height = Math.max(1, Math.floor(pane.clientHeight * dpr));
  }
  window.addEventListener('resize', resize);
  resize();

  function hash(i, s) {
    var x = Math.imul(i + 1, 0x9e3779b1) ^ Math.imul(s + 13, 0x85ebca77);
    x = Math.imul(x ^ (x >>> 15), 0xc2b2ae3d);
    x ^= x >>> 13;
    return (x >>> 0) / 4294967296;
  }

  /* ---- the town behind the rain, drawn once ---------------------------- */
  function buildCity() {
    var off = document.createElement('canvas');
    off.width = W; off.height = H;
    var c = off.getContext('2d');

    var sky = c.createLinearGradient(0, 0, 0, PUDDLE);
    sky.addColorStop(0, '#070b15');
    sky.addColorStop(0.55, '#0d1528');
    sky.addColorStop(1, '#16203a');
    c.fillStyle = sky; c.fillRect(0, 0, W, PUDDLE);

    // three receding bands of rooftops, the far ones washed out by the rain
    var bands = [
      { base: PUDDLE - 96, h: 210, n: 14, fill: '#0b1224', lit: 0.12, glow: '#5d7bb0' },
      { base: PUDDLE - 54, h: 168, n: 11, fill: '#070c1a', lit: 0.18, glow: '#c9a56a' },
      { base: PUDDLE - 14, h: 128, n: 9, fill: '#04070f', lit: 0.26, glow: '#f0c478' }
    ];
    for (var b = 0; b < bands.length; b++) {
      var band = bands[b], x = -40;
      for (var i = 0; x < W + 40; i++) {
        var bw = 42 + 96 * hash(i, b * 7 + 1);
        var bh = band.h * (0.35 + 0.65 * hash(i, b * 7 + 2));
        var top = band.base - bh;
        c.fillStyle = band.fill;
        c.fillRect(x, top, bw, band.base - top + 40);
        // windows
        var cols = Math.max(1, Math.floor(bw / 13));
        var rows = Math.max(1, Math.floor(bh / 17));
        for (var cx = 0; cx < cols; cx++) {
          for (var cy = 0; cy < rows; cy++) {
            var s = i * 997 + cx * 31 + cy;
            if (hash(s, b + 40) > band.lit) continue;
            c.globalAlpha = 0.25 + 0.6 * hash(s, b + 41);
            c.fillStyle = band.glow;
            c.fillRect(x + 5 + cx * 13, top + 6 + cy * 17, 4 + 3 * hash(s, b + 42), 5);
          }
        }
        c.globalAlpha = 1;
        x += bw + 5 + 14 * hash(i, b * 7 + 3);
      }
      // haze between the bands
      c.fillStyle = 'rgba(20,32,58,0.34)';
      c.fillRect(0, band.base - band.h - 30, W, band.h + 70);
    }

    // wet ground below the sill: a smeared mirror of the near band
    c.save();
    c.beginPath(); c.rect(0, PUDDLE, W, H - PUDDLE); c.clip();
    c.globalAlpha = 0.30;
    c.setTransform(1, 0, 0, -0.55, 0, 2 * PUDDLE);
    c.drawImage(off, 0, PUDDLE - 150, W, 150, 0, PUDDLE - 150, W, 150);
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalAlpha = 1;
    var gnd = c.createLinearGradient(0, PUDDLE, 0, H);
    gnd.addColorStop(0, 'rgba(8,12,22,0.35)');
    gnd.addColorStop(1, 'rgba(3,5,10,0.95)');
    c.fillStyle = gnd; c.fillRect(0, PUDDLE, W, H - PUDDLE);
    c.restore();
    return off;
  }

  /* ---- one frame -------------------------------------------------------- */
  function frame(now) {
    if (start === null) start = now;
    var t = (now - start) / 1000;
    var s = model.step(t);
    var f = s.flash;

    var cw = pane.width, ch = pane.height;
    var scale = Math.max(cw / W, ch / H);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#04060b';
    ctx.fillRect(0, 0, cw, ch);
    ctx.setTransform(scale, 0, 0, scale, (cw - W * scale) / 2, (ch - H * scale) / 2);

    ctx.drawImage(city, 0, 0);

    // the sky tears open
    if (f > 0.01) {
      var bx = s.boltX;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var lg = ctx.createRadialGradient(bx, -60, 10, bx, -60, H * 1.15);
      lg.addColorStop(0, 'rgba(198,216,255,' + (0.62 * f).toFixed(4) + ')');
      lg.addColorStop(0.35, 'rgba(120,152,214,' + (0.26 * f).toFixed(4) + ')');
      lg.addColorStop(1, 'rgba(60,84,140,0)');
      ctx.fillStyle = lg; ctx.fillRect(0, 0, W, PUDDLE);
      ctx.fillStyle = 'rgba(150,178,232,' + (0.10 * f).toFixed(4) + ')';
      ctx.fillRect(0, 0, W, PUDDLE);
      ctx.restore();
    }

    drawPuddle(t, f);

    // rain, far layers first so the near sheet sits on top
    var ds = s.drops;
    ctx.lineCap = 'round';
    for (var L = 0; L < 4; L++) {
      ctx.beginPath();
      ctx.lineWidth = 0.7 + 0.45 * L;
      ctx.strokeStyle = 'rgba(' + Math.round(150 + 40 * L) + ',' +
        Math.round(180 + 40 * L) + ',' + Math.round(210 + 45 * L) + ',' +
        (0.10 + 0.09 * L + 0.22 * f).toFixed(3) + ')';
      for (var i = 0; i < ds.length; i++) {
        var d = ds[i];
        if (d.layer !== L) continue;
        var k = d.len / Math.hypot(d.vx, d.vy);
        ctx.moveTo(d.x - d.vx * k, d.y - d.vy * k);
        ctx.lineTo(d.x, d.y);
      }
      ctx.stroke();
    }

    drawSplashes(s.splashes, f);
    drawGlass(s.runners, f);
    drawFrame(f);
    requestAnimationFrame(frame);
  }

  function drawPuddle(t, f) {
    ctx.save();
    var sheen = ctx.createLinearGradient(0, PUDDLE - 8, 0, PUDDLE + 26);
    sheen.addColorStop(0, 'rgba(120,150,205,' + (0.10 + 0.30 * f).toFixed(3) + ')');
    sheen.addColorStop(0.3, 'rgba(70,96,140,0.22)');
    sheen.addColorStop(1, 'rgba(4,7,13,0)');
    ctx.fillStyle = sheen; ctx.fillRect(0, PUDDLE - 8, W, 34);

    ctx.strokeStyle = 'rgba(150,182,236,' + (0.16 + 0.36 * f).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, PUDDLE + 0.5); ctx.lineTo(W, PUDDLE + 0.5); ctx.stroke();

    // rings spreading on the standing water
    ctx.strokeStyle = 'rgba(140,170,220,0.16)';
    for (var i = 0; i < 22; i++) {
      var per = 1.1 + 1.9 * hash(i, 70);
      var age = (t + per * hash(i, 71) * 9) % per;
      var u = age / per;
      var rx = 8 + 66 * u;
      ctx.globalAlpha = 0.30 * (1 - u);
      ctx.beginPath();
      ctx.ellipse(40 + (W - 80) * hash(i, 72), PUDDLE + 4 + 34 * hash(i, 73),
                  rx, rx * 0.22, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSplashes(sp, f) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < sp.length; i++) {
      var p = sp[i];
      ctx.fillStyle = 'rgba(186,210,248,' + (0.34 * p.life + 0.3 * f * p.life).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r * 0.55, p.r, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawGlass(rs, f) {
    for (var i = 0; i < rs.length; i++) {
      var r = rs[i];
      if (r.rate > 0.5) {                       // the wet trail a runner leaves
        var tl = Math.min(90, r.rate * 1.2);
        var tg = ctx.createLinearGradient(r.x, r.y - tl, r.x, r.y);
        tg.addColorStop(0, 'rgba(150,180,225,0)');
        tg.addColorStop(1, 'rgba(170,200,240,0.17)');
        ctx.fillStyle = tg;
        ctx.fillRect(r.x - r.r * 0.55, r.y - tl, r.r * 1.1, tl);
      }
      var g = ctx.createRadialGradient(r.x - r.r * 0.34, r.y - r.r * 0.40, r.r * 0.08,
                                       r.x, r.y, r.r);
      g.addColorStop(0, 'rgba(226,238,255,' + (0.72 + 0.28 * f).toFixed(3) + ')');
      g.addColorStop(0.42, 'rgba(120,152,196,0.30)');
      g.addColorStop(0.82, 'rgba(20,32,52,0.42)');
      g.addColorStop(1, 'rgba(198,220,255,' + (0.22 + 0.4 * f).toFixed(3) + ')');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + 0.4 * f).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(r.x - r.r * 0.30, r.y - r.r * 0.34, Math.max(0.35, r.r * 0.20), 0, TAU);
      ctx.fill();
    }
  }

  function drawFrame(f) {
    // mullions and sill: we are indoors looking out
    ctx.save();
    var dark = 'rgba(6,8,13,0.96)';
    ctx.fillStyle = dark;
    ctx.fillRect(0, 0, W, 14); ctx.fillRect(0, H - 26, W, 26);
    ctx.fillRect(0, 0, 16, H); ctx.fillRect(W - 16, 0, 16, H);
    ctx.fillRect(W / 2 - 7, 0, 14, H);
    ctx.fillStyle = 'rgba(150,178,224,' + (0.05 + 0.22 * f).toFixed(3) + ')';
    ctx.fillRect(W / 2 - 7, 0, 2, H);
    ctx.fillRect(16, 0, 1, H);

    var vg = ctx.createRadialGradient(W / 2, H * 0.46, H * 0.22, W / 2, H * 0.46, H * 0.86);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
})();
</script>
</body>
</html>
