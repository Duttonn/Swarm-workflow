      <text x="689.68" y="236.68" text-anchor="start" font-size="11.5" font-weight="400">Beacon Rise</text>
      <text x="774" y="329.86" text-anchor="start" font-size="11.5" font-weight="400">Almshouse</text>
      <text x="850.28" y="211.72" text-anchor="start" font-size="11.5" font-weight="400">Fernhill</text>
