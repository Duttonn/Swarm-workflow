      <line x1="253.33" y1="467.78" x2="237.78" y2="483.33"/>
      <line x1="753.33" y1="452.22" x2="737.78" y2="436.67"/>
      <line x1="722.22" y1="483.33" x2="706.67" y2="467.78"/>
      <line x1="531" y1="378" x2="509" y2="378"/>
      <line x1="531" y1="422" x2="509" y2="422"/>
    </g>
    <g id="lines" fill="none" stroke-linejoin="round" stroke-linecap="round">
