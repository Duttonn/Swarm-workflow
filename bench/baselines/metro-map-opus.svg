<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-label="Transit map of Meridian">
  <title>Meridian Transit Authority network map</title>
  <defs id="defs">
    <linearGradient id="paper-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#efeadd"/>
    </linearGradient>
    <linearGradient id="water-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd9e8"/>
      <stop offset="1" stop-color="#a8cde0"/>
    </linearGradient>
  </defs>
  <g id="map" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect id="backdrop" x="0" y="0" width="960" height="760" fill="url(#paper-wash)"/>
    <rect x="18" y="18" width="924" height="724" fill="none" stroke="#d9d2c2" stroke-width="2" rx="6"/>
    <g id="river">
      <polyline points="40,460 360,460 420,400 560,400 620,460 920,460" fill="none" stroke="#9cc2d6" stroke-width="40" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>
      <polyline id="river-course" points="40,460 360,460 420,400 560,400 620,460 920,460" fill="none" stroke="url(#water-wash)" stroke-width="32" stroke-linejoin="round" stroke-linecap="round"/>
