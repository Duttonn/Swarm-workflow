      <g stroke="#ffd489" stroke-width="9" opacity="0.22" stroke-linecap="round" fill="none">
        <polyline points="140,566 136,606 142,646 137,686"/>
        <polyline points="404,566 399,616 406,666 400,716 405,766"/>
        <polyline points="775,566 770,610 777,654 771,698 776,742"/>
        <polyline points="1026,566 1021,608 1028,650 1022,692"/>
      </g>
      <g stroke="#a9c4e8" stroke-width="2.5" opacity="0.25" fill="none" stroke-linecap="round">
        <polyline points="40,596 110,592 180,598 250,592 320,598 390,592"/>
        <polyline points="520,624 600,619 680,625 760,619 840,625 920,620"/>
        <polyline points="90,666 190,660 290,668 390,660 490,668"/>
        <polyline points="700,700 810,694 920,702 1030,694 1140,702"/>
        <polyline points="60,760 200,752 340,762 480,752 620,762"/>
        <polyline points="640,830 800,822 960,832 1120,822"/>
      </g>
      <g stroke="#ffc98a" stroke-width="3" opacity="0.4" fill="none" stroke-linecap="round">
        <polyline points="856,588 892,584 928,590 956,584"/>
        <polyline points="846,640 890,634 934,642 966,634"/>
        <polyline points="852,700 896,694 940,702 964,696"/>
      </g>
    </g>
  </g>

  <!-- ============ BIRDS, ABOVE IT ALL ============ -->
  <g id="birds" fill="none" stroke="#241a33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="286,214 300,200 314,212 328,199 342,213"/>
    <polyline points="372,252 383,241 394,250 405,240 416,251"/>
    <polyline points="470,196 482,184 494,195 506,183 518,194"/>
    <polyline points="618,238 628,229 638,237 648,228 658,236"/>
    <polyline points="1052,176 1066,163 1080,175 1094,162 1108,174"/>
