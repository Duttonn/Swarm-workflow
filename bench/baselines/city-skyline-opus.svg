      <rect x="40" y="486" width="5" height="7"/><rect x="62" y="486" width="5" height="7"/>
      <rect x="40" y="508" width="5" height="7"/><rect x="76" y="508" width="5" height="7"/>
      <rect x="142" y="436" width="5" height="7"/><rect x="166" y="460" width="5" height="7"/>
      <rect x="142" y="484" width="5" height="7"/><rect x="166" y="508" width="5" height="7"/>
      <rect x="244" y="398" width="5" height="7"/><rect x="270" y="398" width="5" height="7"/>
      <rect x="244" y="428" width="5" height="7"/><rect x="270" y="458" width="5" height="7"/>
      <rect x="244" y="488" width="5" height="7"/><rect x="270" y="518" width="5" height="7"/>
      <rect x="444" y="422" width="5" height="7"/><rect x="472" y="422" width="5" height="7"/>
      <rect x="444" y="452" width="5" height="7"/><rect x="472" y="482" width="5" height="7"/>
      <rect x="652" y="406" width="5" height="7"/><rect x="680" y="406" width="5" height="7"/>
      <rect x="652" y="436" width="5" height="7"/><rect x="680" y="466" width="5" height="7"/>
      <rect x="652" y="496" width="5" height="7"/><rect x="680" y="526" width="5" height="7"/>
      <rect x="998" y="418" width="5" height="7"/><rect x="1026" y="418" width="5" height="7"/>
      <rect x="998" y="448" width="5" height="7"/><rect x="1026" y="478" width="5" height="7"/>
      <rect x="1100" y="476" width="5" height="7"/><rect x="1126" y="500" width="5" height="7"/>
    </g>
  </g>

