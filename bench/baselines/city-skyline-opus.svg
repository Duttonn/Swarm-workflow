<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="A city skyline at dusk seen across a river, in receding depth layers">
  <title>City skyline at dusk, across the river</title>
  <defs>
    <linearGradient id="grad-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101538"/>
      <stop offset="26%" stop-color="#33275c"/>
      <stop offset="50%" stop-color="#7d3a6d"/>
      <stop offset="70%" stop-color="#c85f57"/>
      <stop offset="86%" stop-color="#f2995a"/>
      <stop offset="100%" stop-color="#ffd39a"/>
    </linearGradient>
    <radialGradient id="grad-sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffdca0" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ff9d5c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff8347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad-river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a5e"/>
      <stop offset="18%" stop-color="#33254a"/>
      <stop offset="60%" stop-color="#1c1533"/>
      <stop offset="100%" stop-color="#100b22"/>
    </linearGradient>
    <linearGradient id="grad-sunpath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcd8a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9a54" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ============ LAYER 1, FURTHEST: SKY ============ -->
  <g id="sky">
    <rect x="0" y="0" width="1200" height="900" fill="url(#grad-sky)"/>
    <g id="stars" fill="#ffffff">
      <circle cx="90" cy="70" r="2.2" opacity="0.9"/>
      <circle cx="210" cy="128" r="1.6" opacity="0.65"/>
      <circle cx="332" cy="58" r="2.6" opacity="0.85"/>
      <circle cx="455" cy="116" r="1.5" opacity="0.6"/>
      <circle cx="560" cy="44" r="2.0" opacity="0.8"/>
      <circle cx="676" cy="96" r="1.7" opacity="0.55"/>
      <circle cx="795" cy="52" r="2.4" opacity="0.85"/>
      <circle cx="900" cy="132" r="1.4" opacity="0.5"/>
      <circle cx="1015" cy="70" r="2.1" opacity="0.75"/>
      <circle cx="1128" cy="118" r="1.6" opacity="0.6"/>
      <circle cx="1060" cy="186" r="1.3" opacity="0.4"/>
      <circle cx="146" cy="196" r="1.3" opacity="0.4"/>
    </g>
    <circle cx="905" cy="448" r="178" fill="url(#grad-sunglow)"/>
    <circle id="sun" cx="905" cy="448" r="66" fill="#ffe7ac"/>
    <circle cx="905" cy="448" r="52" fill="#fff6d8"/>
  </g>

  <!-- ============ LAYER 2: FAR HILLS ============ -->
  <g id="hills">
    <polygon id="hills-silhouette" fill="#7d7486"
             points="0,520 0,498 60,490 120,478 190,470 260,476 330,488 400,496 470,486 540,474 610,470 680,480 750,492 820,486 890,476 960,470 1030,478 1100,490 1160,498 1200,494 1200,520"/>
    <rect x="0" y="520" width="1200" height="40" fill="#6d6379"/>
    <rect x="0" y="520" width="1200" height="8" fill="#8b7f96" opacity="0.5"/>
  </g>

  <!-- ============ LAYER 3: MID SKYLINE ============ -->
  <g id="skyline">
    <polygon id="skyline-silhouette" fill="#5c4a6b"
             points="0,545 30,545 30,470 95,470 95,545 130,545 130,420 190,420 190,545 230,545 230,380 300,380 300,545 340,545 340,455 395,455 395,545 430,545 430,405 500,405 500,545 540,545 540,470 600,470 600,545 640,545 640,390 705,390 705,545 745,545 745,440 805,440 805,545 985,545 985,400 1050,400 1050,545 1090,545 1090,460 1150,460 1150,545 1200,545"/>
