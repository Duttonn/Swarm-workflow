      <rect x="12" y="498" width="13" height="17"/><rect x="56" y="498" width="13" height="17"/>
      <rect x="34" y="524" width="13" height="17"/><rect x="56" y="524" width="13" height="17"/>
      <rect x="132" y="416" width="13" height="17" fill="#fff3cf"/><rect x="180" y="416" width="13" height="17"/>
      <rect x="156" y="446" width="13" height="17"/><rect x="132" y="476" width="13" height="17"/>
      <rect x="180" y="476" width="13" height="17"/><rect x="156" y="506" width="13" height="17"/>
      <rect x="132" y="536" width="13" height="17"/><rect x="180" y="536" width="13" height="17"/>
      <rect x="266" y="514" width="13" height="17"/><rect x="290" y="514" width="13" height="17"/>
      <rect x="266" y="538" width="13" height="17"/>
      <rect x="372" y="336" width="13" height="17" fill="#fff3cf"/><rect x="424" y="336" width="13" height="17"/>
      <rect x="398" y="336" width="13" height="17"/><rect x="398" y="368" width="13" height="17"/>
      <rect x="372" y="400" width="13" height="17"/><rect x="424" y="400" width="13" height="17"/>
      <rect x="398" y="432" width="13" height="17"/><rect x="372" y="464" width="13" height="17"/>
      <rect x="424" y="464" width="13" height="17" fill="#fff3cf"/><rect x="398" y="496" width="13" height="17"/>
      <rect x="372" y="528" width="13" height="17"/><rect x="424" y="528" width="13" height="17"/>
      <rect x="512" y="446" width="13" height="17"/><rect x="538" y="446" width="13" height="17"/>
      <rect x="512" y="476" width="13" height="17"/><rect x="538" y="506" width="13" height="17"/>
      <rect x="512" y="536" width="13" height="17"/>
      <rect x="627" y="496" width="13" height="17"/><rect x="653" y="496" width="13" height="17"/>
      <rect x="627" y="524" width="13" height="17"/><rect x="653" y="524" width="13" height="17"/>
      <rect x="742" y="376" width="13" height="17"/><rect x="794" y="376" width="13" height="17" fill="#fff3cf"/>
      <rect x="768" y="408" width="13" height="17"/><rect x="742" y="440" width="13" height="17"/>
      <rect x="794" y="440" width="13" height="17"/><rect x="768" y="472" width="13" height="17"/>
      <rect x="742" y="504" width="13" height="17"/><rect x="794" y="504" width="13" height="17"/>
      <rect x="768" y="536" width="13" height="17"/><rect x="794" y="536" width="13" height="17"/>
      <rect x="1012" y="430" width="13" height="17"/><rect x="1040" y="430" width="13" height="17"/>
      <rect x="1012" y="460" width="13" height="17"/><rect x="1040" y="490" width="13" height="17"/>
      <rect x="1012" y="520" width="13" height="17"/><rect x="1040" y="520" width="13" height="17"/>
      <rect x="1122" y="486" width="13" height="17"/><rect x="1150" y="486" width="13" height="17"/>
      <rect x="1122" y="514" width="13" height="17"/><rect x="1150" y="542" width="13" height="17"/>
    </g>
  </g>

  <!-- ============ LAYER 5, IN FRONT: RIVER ============ -->
