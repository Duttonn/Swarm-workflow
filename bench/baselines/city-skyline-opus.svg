    <rect x="0" y="560" width="1200" height="340" fill="url(#grad-river)"/>
    <rect x="838" y="560" width="134" height="340" fill="url(#grad-sunpath)"/>
    <rect id="waterline" x="0" y="560" width="1200" height="3" fill="#ffc98a" opacity="0.75"/>
    <g id="reflections">
      <polygon id="blocks-reflection" fill="#241834" opacity="0.85"
               points="0,560 0,665 70,665 70,560 120,560 120,720 210,720 210,560 255,560 255,620 320,620 320,560 360,560 360,800 455,800 455,560 500,560 500,690 575,690 575,560 615,560 615,640 690,640 690,560 730,560 730,760 815,760 815,560 1000,560 1000,705 1070,705 1070,560 1110,560 1110,650 1180,650 1180,560 1200,560"/>
