<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPT-6 Astra</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #04060b; overflow: hidden; }
  #stage { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .word {
    position: absolute; top: 50%; transform: translateY(-50%);
    font: 300 clamp(28px, 5vw, 76px)/1 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    color: #f4f7ff; letter-spacing: 0.01em; text-shadow: 0 0 24px rgba(140,180,255,0.35);
    pointer-events: none; user-select: none;
  }
  #lhs { left: max(3vw, 18px); }
  #rhs { right: max(3vw, 18px); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="word" id="lhs">GPT</div>
<div class="word" id="rhs">Astra</div>

<script id="galaxy-model" type="module">
/* Pure math. No drawing surface, no DOM, no globals: the gate runs this file on its own
   in node and rejects it if it reaches for anything outside arithmetic. */

const COUNT      = 1500;   // total particles
const ARMS       = 2;      // spiral arms
const ARM_SHARE  = 0.74;   // fraction of particles bound to an arm, rest is bulge/halo
const D_MIN      = 0.045;  // inner cutoff, normalised radius
const D_POW      = 1.9;    // >1 pushes particles inward, giving a dense core
const TWIST      = 0.62;   // radians of winding per e-fold of radius
const ARM_JITTER = 0.30;   // angular scatter across an arm, widening outward
const OMEGA0     = 0.030;  // angular speed scale, radians/second
const SOFT       = 0.15;   // softening: omega = OMEGA0/(d+SOFT), so the core sweeps faster
const SCALE      = 520;    // model units out

/* mulberry32: deterministic, so points(t) is reproducible for a given t. */
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

function gauss(rand) {
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function build() {
  const rand = rng(20260911);
  const out = [];
  for (let i = 0; i < COUNT; i++) {
    const onArm = rand() < ARM_SHARE;
    let d, a0;
    if (onArm) {
      d = D_MIN + (1 - D_MIN) * Math.pow(rand(), D_POW);
      const arm = Math.floor(rand() * ARMS) * (2 * Math.PI / ARMS);
      const wind = TWIST * Math.log(d / D_MIN);
      a0 = arm + wind + gauss(rand) * ARM_JITTER * (0.35 + d);
    } else {
      // bulge and faint halo: rounder, concentrated, no arm allegiance
      d = D_MIN + 0.42 * Math.pow(rand(), 2.4);
      a0 = rand() * 2 * Math.PI;
    }
    const bright = Math.pow(rand(), 3);
    out.push({
      d,
      a0,
      r: 0.45 + 3.2 * bright,
      omega: OMEGA0 / (d + SOFT),
      warm: rand() < 0.17,
      glow: 0.30 + 0.70 * bright,
      spike: bright > 0.90
    });
  }
  return out;
}

const SEEDS = build();

export function points(t) {
  const out = new Array(SEEDS.length);
  for (let i = 0; i < SEEDS.length; i++) {
    const s = SEEDS[i];
    const a = s.a0 + s.omega * t;
    const radius = s.d * SCALE;
    out[i] = {
      x: Math.cos(a) * radius,
      y: Math.sin(a) * radius,
      r: s.r,
      glow: s.glow,
      warm: s.warm,
      spike: s.spike
    };
  }
  return out;
}

export const EXTENT = SCALE;
</script>

<script>
(function () {
  var stage = document.getElementById('stage');
  var ctx = stage.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var model = null;
  var start = null;

  // The model lives in the module block above; pull it out of the document and evaluate it
  // as a module so the page still makes zero network requests.
  var src = document.getElementById('galaxy-model').textContent;
  var blob = new Blob([src], { type: 'text/javascript' });
  var url = URL.createObjectURL(blob);
  import(url).then(function (m) { model = m; requestAnimationFrame(frame); });

  function resize() {
    stage.width = Math.floor(stage.clientWidth * dpr);
    stage.height = Math.floor(stage.clientHeight * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  var WARM = [255, 176, 108];
  var COOL = [198, 222, 255];

  function star(x, y, r, glow, warm, spike, unit) {
    var c = warm ? WARM : COOL;
    var rgb = c[0] + ',' + c[1] + ',' + c[2];
    var halo = r * unit * 7;
    var g = ctx.createRadialGradient(x, y, 0, x, y, halo);
    g.addColorStop(0, 'rgba(' + rgb + ',' + (0.55 * glow).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(' + rgb + ',' + (0.14 * glow).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, halo, 0, 6.28318);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + 0.45 * glow).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.4, r * unit), 0, 6.28318);
    ctx.fill();

    if (spike) {
      var len = r * unit * 9;
      var grad = ctx.createLinearGradient(x - len, y, x + len, y);
      grad.addColorStop(0, 'rgba(' + rgb + ',0)');
      grad.addColorStop(0.5, 'rgba(' + rgb + ',0.5)');
      grad.addColorStop(1, 'rgba(' + rgb + ',0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = Math.max(0.5, unit * 0.7);
      ctx.beginPath(); ctx.moveTo(x - len, y); ctx.lineTo(x + len, y); ctx.stroke();
      var grad2 = ctx.createLinearGradient(x, y - len, x, y + len);
      grad2.addColorStop(0, 'rgba(' + rgb + ',0)');
      grad2.addColorStop(0.5, 'rgba(' + rgb + ',0.5)');
      grad2.addColorStop(1, 'rgba(' + rgb + ',0)');
      ctx.strokeStyle = grad2;
      ctx.beginPath(); ctx.moveTo(x, y - len); ctx.lineTo(x, y + len); ctx.stroke();
    }
  }

  function frame(ts) {
    if (start === null) start = ts;
    var t = (ts - start) / 1000;
    var w = stage.width, h = stage.height;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#04060b';
    ctx.fillRect(0, 0, w, h);

    var cx = w / 2, cy = h / 2;
    var EXTENT = model.EXTENT;
    var unit = Math.min(w, h) / (EXTENT * 2.35);

    // faint nebula wash behind the arms
    var wash = ctx.createRadialGradient(cx, cy, 0, cx, cy, EXTENT * unit * 1.15);
    wash.addColorStop(0, 'rgba(150,175,225,0.13)');
    wash.addColorStop(0.45, 'rgba(90,110,165,0.05)');
    wash.addColorStop(1, 'rgba(10,14,28,0)');
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'lighter';

    var ps = model.points(t);
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      star(cx + p.x * unit, cy + p.y * unit, p.r, p.glow, p.warm, p.spike, unit);
    }

    // hot core on top
    var core = ctx.createRadialGradient(cx, cy, 0, cx, cy, EXTENT * unit * 0.20);
    core.addColorStop(0, 'rgba(255,252,244,0.92)');
    core.addColorStop(0.25, 'rgba(240,235,255,0.30)');
    core.addColorStop(1, 'rgba(190,205,255,0)');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(cx, cy, EXTENT * unit * 0.20, 0, 6.28318);
    ctx.fill();

    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
